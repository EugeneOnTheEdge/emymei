<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emy Mei Indahati</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e9ee;--ink:#0f2a5f;--ink2:#38508a;--mute:#6a7898;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:96px;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.55}
body::before{width:520px;height:520px;background:#9fb4e6;top:-120px;left:-140px}
body::after{width:480px;height:480px;background:#c9d3ee;bottom:-140px;right:-120px}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.62),rgba(255,255,255,.28));-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(15,42,95,.05),0 10px 34px rgba(15,42,95,.09)}
.t{display:inline-block;transition:opacity .19s ease,transform .19s ease,filter .19s ease}
.t.out{opacity:0;transform:translateY(8px);filter:blur(6px)}
span.t{display:inline}
/* nav */
nav{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;max-width:calc(100% - 24px);animation:drop .9s .1s both cubic-bezier(.2,.9,.3,1)}
nav a{color:var(--ink2);text-decoration:none;font-size:14px;font-weight:500;padding:8px 14px;border-radius:999px;transition:background .3s,color .3s;white-space:nowrap}
nav a:hover{background:rgba(255,255,255,.7);color:var(--ink)}
.seg{position:relative;display:flex;padding:3px;border-radius:999px;background:rgba(15,42,95,.08);box-shadow:inset 0 1px 3px rgba(15,42,95,.12)}
.seg button{position:relative;z-index:1;width:44px;padding:6px 0;border:0;background:none;font:600 13px inherit;font-family:inherit;color:var(--ink2);cursor:pointer;transition:color .35s}
.seg button.on{color:var(--ink)}
.thumb{position:absolute;top:3px;bottom:3px;left:3px;width:44px;border-radius:999px;background:rgba(255,255,255,.95);box-shadow:0 2px 8px rgba(15,42,95,.18),inset 0 1px 0 #fff;transition:transform .5s cubic-bezier(.3,1.35,.5,1)}
.seg[data-l=en] .thumb{transform:translateX(44px)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media(max-width:640px){nav a{display:none}}
/* hero */
header{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:110px 24px 60px}
.ph{width:168px;height:168px;border-radius:50%;padding:6px;animation:pop 1.1s .25s both cubic-bezier(.2,.9,.3,1)}
.ph img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 20%;display:block}
h1{font-size:clamp(40px,8vw,84px);line-height:1.02;letter-spacing:-.035em;font-weight:700;margin-top:28px;animation:rise 1s .45s both cubic-bezier(.2,.9,.3,1)}
.role{font-size:clamp(19px,3vw,28px);color:var(--ink2);font-weight:500;margin-top:10px;animation:rise 1s .6s both cubic-bezier(.2,.9,.3,1)}
.bio{max-width:560px;color:var(--mute);font-size:clamp(16px,2vw,19px);margin-top:18px;animation:rise 1s .75s both cubic-bezier(.2,.9,.3,1)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px;animation:rise 1s .9s both cubic-bezier(.2,.9,.3,1)}
.chip{color:var(--ink);text-decoration:none;font-size:15px;font-weight:500;padding:11px 18px;border-radius:999px;transition:transform .35s cubic-bezier(.3,1.4,.5,1),box-shadow .35s}
.chip:hover{transform:translateY(-2px) scale(1.03)}.chip:active{transform:scale(.96)}
@keyframes rise{from{opacity:0;transform:translateY(26px);filter:blur(8px)}}
@keyframes pop{from{opacity:0;transform:scale(.8);filter:blur(10px)}}
@keyframes drop{from{opacity:0;transform:translate(-50%,-20px)}}
/* sections */
main{max-width:980px;margin:0 auto;padding:0 20px 80px}
section{padding:70px 0 10px}
h2{font-size:clamp(30px,5vw,48px);letter-spacing:-.03em;font-weight:700;margin-bottom:28px}
.rv{opacity:0;transform:translateY(30px);filter:blur(6px);transition:opacity .9s cubic-bezier(.2,.9,.3,1),transform .9s cubic-bezier(.2,.9,.3,1),filter .9s}
.rv.in{opacity:1;transform:none;filter:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.card{border-radius:28px;padding:26px}
.stat{transition:transform .5s cubic-bezier(.3,1.3,.5,1)}.stat:hover{transform:translateY(-4px)}
.stat b{display:block;font-size:clamp(34px,4.5vw,46px);letter-spacing:-.03em;line-height:1.1}
.stat span{color:var(--ink2);font-size:16px}
.job{margin-bottom:16px}
.job .top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:baseline}
.job h3{font-size:21px;letter-spacing:-.015em}
.yr{color:var(--ink2);font-weight:600;font-size:15px;white-space:nowrap}
.co{color:var(--mute);font-size:15px;margin-top:2px}
.job ul{margin:14px 0 0;padding-left:20px;color:var(--ink2)}
.job li{margin:5px 0}
.old{display:grid;gap:0}
.old div{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 0;border-top:1px solid rgba(15,42,95,.1)}
.old div:first-child{border-top:0}
.old p{color:var(--mute);font-size:15px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.cert{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid rgba(15,42,95,.1)}
.cert:first-child{border-top:0}
.cert small{display:block;color:var(--mute);font-size:13px}
details{border-radius:28px;padding:6px 26px}
summary{list-style:none;cursor:pointer;font-size:20px;font-weight:600;padding:20px 0;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary i{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.8);display:grid;place-items:center;font-style:normal;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
details.show summary i{transform:rotate(45deg)}
.acc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.3,.9,.3,1)}
details.show .acc{grid-template-rows:1fr}
.acc>div{overflow:hidden}
.acc ul{padding:0 0 22px 20px;color:var(--ink2)}.acc li{margin:7px 0}
footer{text-align:center;color:var(--mute);font-size:14px;padding:40px 20px 50px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}.rv{opacity:1;transform:none;filter:none}}

:root{--serif:"Playfair Display",Georgia,"Times New Roman",serif}
html{scroll-padding-top:140px}
h1,h2,h3,.stat b,#brand b{font-family:var(--serif)}
h2{font-weight:600;letter-spacing:-.015em}
.seg button{font-size:18px}
.stat b{white-space:nowrap;font-size:clamp(28px,3.3vw,36px);font-weight:600;letter-spacing:-.01em}
.stat h3{font-size:22px}
header{padding:0 clamp(16px,4vw,48px) clamp(24px,6vh,56px);align-items:flex-start;justify-content:flex-end;text-align:left}
#hp{position:relative;z-index:6;max-width:640px;border-radius:34px;padding:30px 32px}
#hp h1{margin-top:0;font-size:clamp(34px,6vw,60px);line-height:1.05;letter-spacing:-.015em;font-weight:700}
#hp .chips{justify-content:flex-start}
#av{position:fixed;z-index:5;left:0;top:0;width:100vw;height:100svh;overflow:hidden;pointer-events:none;background:#e1e2e6;box-shadow:0 6px 18px rgba(15,42,95,calc(var(--ring,0)*.25))}
#av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
#av::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px rgba(255,255,255,calc(var(--ring,0)*.9))}
#brand{position:fixed;z-index:11;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:6px 20px 6px 6px;border-radius:999px;opacity:0;white-space:nowrap}
#brand b{font-size:18px;font-weight:600}
#slot{display:block;flex:none;width:40px;height:40px}
#brand{pointer-events:none}
#hp{width:fit-content;max-width:100%}
#hp h1{white-space:nowrap;font-size:min(48px,4.6vw)}
#hp .role{white-space:nowrap;font-size:min(21px,2.4vw)}
@media(max-width:640px){#hp{padding:22px 18px}}
#contact{padding-bottom:30px}
.cta{text-align:center;border-radius:40px;padding:clamp(36px,7vw,72px) 24px}
.cta h2{margin-bottom:12px}
.cta p{color:var(--ink2);max-width:480px;margin:0 auto 28px;font-size:18px}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 30px;border-radius:999px;font-size:17px;font-weight:600;text-decoration:none;color:var(--ink);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn:active{transform:scale(.96)}
.btn.pri{color:#fff;background:linear-gradient(145deg,rgba(15,42,95,.92),rgba(36,70,140,.85));border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 28px rgba(15,42,95,.3)}
#hp .role{font-size:min(22px,3.2vw)}
@media(max-width:640px){#hp h1{font-size:min(38px,8.4vw);line-height:1.1}#hp h1 .t{display:block;font-size:.55em;font-weight:500;color:var(--ink2);margin-bottom:2px}#hp h1 .nm{display:block}}
.dd{display:none;position:relative}
.ddb{display:flex;align-items:center;gap:6px;border:0;background:none;cursor:pointer;font-family:inherit;font-size:18px;color:var(--ink2);padding:6px 12px;border-radius:999px;height:38px}
.ddb i{font-style:normal;font-size:12px;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.dd.open .ddb i{transform:rotate(180deg)}
.ddm{position:absolute;right:0;top:calc(100% + 14px);min-width:168px;padding:6px;border-radius:22px;display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.82);opacity:0;visibility:hidden;transform:translateY(-8px) scale(.96);transform-origin:top right;transition:opacity .25s,transform .35s cubic-bezier(.3,1.3,.5,1),visibility 0s .35s}
.dd.open .ddm{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.ddm button{display:flex;gap:10px;align-items:center;border:0;background:none;font-family:inherit;font-size:16px;font-weight:500;color:var(--ink);padding:11px 14px;border-radius:16px;cursor:pointer;text-align:left;transition:background .25s}
.ddm button:hover,.ddm button.on{background:rgba(15,42,95,.08)}
@media(max-width:640px){.seg{display:none}.dd{display:block}nav{animation:none;left:auto;right:12px;transform:none;top:calc(env(safe-area-inset-top,0px) + 12px)!important;padding:4px;max-width:none}}
#brand{height:54px}
@media(max-width:640px){nav{height:54px;padding:0 4px;align-items:center}.ddb{height:46px;padding:0 14px}}
</style></head>

  document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x.dataset.l===lang));
  document.documentElement.lang=lang;
  const els=[...document.querySelectorAll(".t")];
  els.forEach((el,i)=>{el.style.transitionDelay=Math.min(i*9,170)+"ms";el.classList.add("out")});
  setTimeout(()=>{
    els.forEach(el=>{el.innerHTML=el.dataset[lang];});
    requestAnimationFrame(()=>{els.forEach(el=>el.classList.remove("out"));
      setTimeout(()=>{els.forEach(el=>el.style.transitionDelay="");busy=false},470)});
  },370);
});
</script>
</body></html>
